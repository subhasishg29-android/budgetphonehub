<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="herobg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ringglow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#herobg)"/>
  <!-- Phone outline -->
  <rect x="250" y="60" width="300" height="380" rx="36" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Power bank on phone -->
  <rect x="290" y="140" width="220" height="260" rx="24" fill="#090d16" stroke="url(#ringglow)" stroke-width="4"/>
  <circle cx="400" cy="240" r="55" fill="none" stroke="url(#ringglow)" stroke-width="8"/>
  <rect x="393" y="305" width="14" height="35" rx="5" fill="url(#ringglow)"/>
  <text x="400" y="375" font-family="Inter, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">5000 mAh Magnetic Power Bank</text>
  <!-- Flash indicator -->
  <polygon points="400,215 390,240 402,240 395,265 412,235 398,235" fill="#f59e0b"/>
</svg>
