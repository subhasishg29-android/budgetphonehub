<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="16" fill="#0c4a6e"/>
  <!-- Lanyard cable -->
  <path d="M 200 0 C 150 40, 250 40, 200 70" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <!-- Pouch body -->
  <rect x="140" y="70" width="120" height="180" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="3"/>
  <!-- Dual clip locking bar -->
  <rect x="130" y="60" width="140" height="24" rx="6" fill="#0284c7"/>
  <circle cx="150" cy="72" r="5" fill="#f8fafc"/>
  <circle cx="250" cy="72" r="5" fill="#f8fafc"/>
  <text x="200" y="275" font-family="Inter, sans-serif" font-weight="700" font-size="15" fill="#f8fafc" text-anchor="middle">IPX8 Waterproof Pouch</text>
</svg>
