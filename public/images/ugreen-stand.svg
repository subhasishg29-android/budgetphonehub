<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" rx="16" fill="#0f172a"/>
  <!-- Stand base -->
  <ellipse cx="200" cy="240" rx="90" ry="18" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <!-- Stand arm -->
  <path d="M 200 230 L 220 140 L 190 100" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Phone outline resting on stand -->
  <rect x="140" y="60" width="100" height="150" rx="14" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="3" transform="rotate(-10 190 135)"/>
  <text x="200" y="275" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#f8fafc" text-anchor="middle">UGREEN Desk Stand</text>
</svg>
